version: '3.8'

services:
  vllm-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vllm-openai-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ../../models:/models:ro
      - ./cache:/root/.cache/huggingface
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - VLLM_USE_MODELSCOPE=false
      - HF_HOME=/root/.cache/huggingface
    env_file:
      - ../../configs/strong-vllm.env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      --model /models/${MODEL_NAME:-model}
      --host 0.0.0.0
      --port 8080
      --tensor-parallel-size ${TENSOR_PARALLEL:-1}
      --dtype ${DTYPE:-auto}
      --max-model-len ${MAX_MODEL_LEN:-32768}
      --gpu-memory-utilization ${GPU_MEMORY_UTIL:-0.9}
      --enable-prefix-caching
      --disable-log-requests
    networks:
      - llm-network
    shm_size: '16gb'

networks:
  llm-network:
    driver: bridge
    name: llm-network
    external: true
